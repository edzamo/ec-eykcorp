# Límite de intentos de login por IP (mitiga fuerza bruta). Va a nivel http (este archivo se incluye ahí).
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 8080;
    server_tokens off;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://ms-cliente-gestion:8080/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # La API vive bajo /api; el prefijo se retira al reenviar al backend.
    location /api/ {
        proxy_pass http://ms-cliente-gestion:8080/;
        # Para que Swagger UI (servido por el backend) genere enlaces con el prefijo /api
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Los archivos de la SPA llevan hash en el nombre: se pueden cachear mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA: cualquier ruta del router cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

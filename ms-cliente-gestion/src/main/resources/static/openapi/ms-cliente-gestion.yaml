openapi: 3.0.3
info:
  title: ms-cliente-gestion
  version: 0.1.0
  description: |
    Microservicio de gestión (CRUD) de clientes. Este documento es la **fuente de verdad** del contrato
    REST (API-first): el código se verifica contra él mediante pruebas de conformidad.

    La API es stateless y usa JWT Bearer (HS256). Obtenga un token con `POST /auth/login` y envíelo en la
    cabecera `Authorization: Bearer <token>`. Los errores usan el formato `application/problem+json` (RFC 7807).
servers:
  - url: /api
    description: Detrás de Nginx (aplicación completa)
  - url: /
    description: Directo al microservicio
tags:
  - name: Autenticación
    description: Emisión de tokens JWT para el administrador.
  - name: Clientes
    description: Alta, consulta, actualización y baja de clientes.
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Autenticación]
      operationId: login
      summary: Inicia sesión y devuelve un token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              usuario: admin
              password: mi-clave-secreta
      responses:
        '200':
          description: Credenciales válidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhZG1pbiJ9.firma
                expiraEn: 900
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          description: Credenciales inválidas (no distingue usuario de contraseña).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: No autenticado
                status: 401
                detail: Credenciales inválidas
                instance: /auth/login
  /clientes:
    post:
      tags: [Clientes]
      operationId: crearCliente
      summary: Crea un cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
            example:
              nombres: Ana María
              apellidos: Pérez Loor
              correo: ana.perez@example.com
              telefono: '0991234567'
      responses:
        '201':
          description: Cliente creado.
          headers:
            Location:
              description: URI del cliente creado.
              schema:
                type: string
                example: /clientes/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
              example:
                id: 1
                nombres: Ana María
                apellidos: Pérez Loor
                correo: ana.perez@example.com
                telefono: '0991234567'
                fechaCreacion: '2026-10-05T15:30:00.123456Z'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '409':
          $ref: '#/components/responses/CorreoDuplicado'
    get:
      tags: [Clientes]
      operationId: listarClientes
      summary: Lista todos los clientes
      responses:
        '200':
          description: Lista de clientes (puede ser vacía).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClienteResponse'
              example:
                - id: 1
                  nombres: Ana María
                  apellidos: Pérez Loor
                  correo: ana.perez@example.com
                  telefono: '0991234567'
                  fechaCreacion: '2026-10-05T15:30:00.123456Z'
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /clientes/{id}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    get:
      tags: [Clientes]
      operationId: obtenerCliente
      summary: Obtiene un cliente por id
      responses:
        '200':
          description: Cliente encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
              example:
                id: 1
                nombres: Ana María
                apellidos: Pérez Loor
                correo: ana.perez@example.com
                telefono: null
                fechaCreacion: '2026-10-05T15:30:00.123456Z'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Clientes]
      operationId: actualizarCliente
      summary: Actualiza un cliente (reemplazo completo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
            example:
              nombres: Ana María
              apellidos: Pérez Loor
              correo: ana.perez@example.com
              telefono: '+593991234567'
      responses:
        '200':
          description: Cliente actualizado (conserva su fecha de creación).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
              example:
                id: 1
                nombres: Ana María
                apellidos: Pérez Loor
                correo: ana.perez@example.com
                telefono: '+593991234567'
                fechaCreacion: '2026-10-05T15:30:00.123456Z'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/CorreoDuplicado'
    delete:
      tags: [Clientes]
      operationId: eliminarCliente
      summary: Elimina un cliente
      responses:
        '204':
          description: Cliente eliminado.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /actuator/health:
    get:
      tags: [Clientes]
      operationId: salud
      summary: Estado de salud del servicio
      security: []
      responses:
        '200':
          description: El servicio está operativo.
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Salud'
              example:
                status: UP
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
              example:
                status: UP
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido en `POST /auth/login`.
  parameters:
    ClienteId:
      name: id
      in: path
      required: true
      description: Identificador del cliente.
      schema:
        type: integer
        format: int64
        example: 1
  schemas:
    LoginRequest:
      type: object
      required: [usuario, password]
      properties:
        usuario:
          type: string
          minLength: 1
          maxLength: 128
          example: admin
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
          example: mi-clave-secreta
    LoginResponse:
      type: object
      required: [token, expiraEn]
      properties:
        token:
          type: string
          description: Token JWT firmado (HS256).
        expiraEn:
          type: integer
          format: int64
          description: Vigencia del token en segundos.
          example: 900
    ClienteRequest:
      type: object
      required: [nombres, apellidos, correo]
      properties:
        nombres:
          type: string
          minLength: 1
          maxLength: 100
          example: Ana María
        apellidos:
          type: string
          minLength: 1
          maxLength: 100
          example: Pérez Loor
        correo:
          type: string
          format: email
          maxLength: 254
          description: Único entre clientes.
          example: ana.perez@example.com
        telefono:
          type: string
          nullable: true
          description: Opcional. De 7 a 15 dígitos con un "+" inicial opcional.
          pattern: '^\+?\d{7,15}$'
          example: '0991234567'
    ClienteResponse:
      type: object
      required: [id, nombres, apellidos, correo, fechaCreacion]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombres:
          type: string
          example: Ana María
        apellidos:
          type: string
          example: Pérez Loor
        correo:
          type: string
          format: email
          example: ana.perez@example.com
        telefono:
          type: string
          nullable: true
          example: '0991234567'
        fechaCreacion:
          type: string
          format: date-time
          example: '2026-10-05T15:30:00.123456Z'
    Salud:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
    Problem:
      type: object
      description: Error según RFC 7807 (`application/problem+json`).
      required: [status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Datos inválidos
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: La petición contiene datos inválidos
        instance:
          type: string
          example: /clientes
        errores:
          type: object
          description: Solo en 400 de validación de campos (campo → mensaje).
          additionalProperties:
            type: string
          example:
            correo: debe ser una dirección de correo electrónico con formato válido
  responses:
    SolicitudInvalida:
      description: Petición inválida (validación de campos, JSON malformado o valor de dominio inválido).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Datos inválidos
            status: 400
            detail: La petición contiene datos inválidos
            instance: /clientes
            errores:
              nombres: no debe estar vacío
              correo: debe ser una dirección de correo electrónico con formato válido
    NoAutenticado:
      description: Falta el token, es inválido o ha expirado.
      headers:
        WWW-Authenticate:
          description: Esquema de autenticación requerido.
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: No autenticado
            status: 401
            detail: Autenticación requerida
            instance: /clientes
    NoEncontrado:
      description: No existe un cliente con ese id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Cliente no encontrado
            status: 404
            detail: No existe un cliente con id 42
            instance: /clientes/42
    CorreoDuplicado:
      description: Ya existe un cliente con ese correo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Correo duplicado
            status: 409
            detail: Ya existe un cliente con el correo indicado
            instance: /clientes

spring:
  application:
    name: ms-cliente-gestion
  # Sin valores por defecto con credenciales: se inyectan por variables de entorno (.env / compose)
  r2dbc:
    url: ${SPRING_R2DBC_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    mongodb:
      # Incluye authSource y serverSelectionTimeoutMS (auditoría de mejor esfuerzo, EXC-2)
      uri: ${SPRING_DATA_MONGODB_URI}
  flyway:
    # Flyway usa JDBC solo al arrancar para migrar
    url: ${SPRING_FLYWAY_URL}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

app:
  security:
    # Sin valores por defecto con secretos: JWT_SECRET (>= 32 caracteres), ADMIN_USER y
    # ADMIN_PASSWORD_HASH (BCrypt) son obligatorios; sin ellos la aplicación no arranca.
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
      issuer: ms-cliente-gestion
    admin:
      user: ${ADMIN_USER}
      password-hash: ${ADMIN_PASSWORD_HASH}

server:
  port: ${SERVER_PORT:8080}
  # Detrás de Nginx la UI vive bajo /api: respeta X-Forwarded-Prefix (y demás X-Forwarded-*)
  forward-headers-strategy: framework

# Contract-first: el YAML estático es la única fuente de verdad. springdoc exige api-docs.enabled=true
# para montar Swagger UI, pero la UI apunta al YAML (swagger-ui.url) y /v3/api-docs (generado desde el
# código) NO está permitido en SecurityConfig: queda denegado (401), nunca se publica ni se usa.
# Solo /v3/api-docs/swagger-config (configuración de la UI) es público.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    # springdoc antepone X-Forwarded-Prefix (p. ej. /api) en la configuración que sirve a la UI
    url: /openapi/ms-cliente-gestion.yaml

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # La auditoría es de mejor esfuerzo (EXC-2): Mongo caído no debe marcar el servicio como DOWN
    mongo:
      enabled: false
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.eykcorp.clientes: ${APP_LOG_LEVEL:INFO}

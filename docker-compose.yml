name: eykcorp-clientes

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - eyk-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mongo:
    build:
      context: ./infra/mongo
    image: eykcorp/mongo-auditoria:7.0.43
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?defina MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?defina MONGO_PASSWORD en .env}
      MONGO_APP_USER: ${MONGO_APP_USER:?defina MONGO_APP_USER en .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?defina MONGO_APP_PASSWORD en .env}
    volumes:
      - mongodata:/data/db
    networks:
      - eyk-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ms-cliente-gestion:
    build:
      context: ./ms-cliente-gestion
    image: eykcorp/ms-cliente-gestion:0.1.0
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/auditoria?authSource=auditoria&serverSelectionTimeoutMS=2000
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (>=32 caracteres) en .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-15}
      ADMIN_USER: ${ADMIN_USER:?defina ADMIN_USER en .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?defina ADMIN_PASSWORD_HASH (BCrypt) en .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - eyk-net
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ms-cliente-presentacion:
    build:
      context: ./ms-cliente-presentacion
    image: eykcorp/ms-cliente-presentacion:0.1.0
    ports:
      - "8080:8080"
    depends_on:
      ms-cliente-gestion:
        condition: service_healthy
    networks:
      - eyk-net
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # AWS simulado en local. Solo arranca con el perfil "aws":
  #   docker compose --profile aws up -d localstack
  # Versión fijada SIN token de cuenta (desde marzo 2026 "latest" exige uno). Ver ADR-014.
  localstack:
    image: localstack/localstack:4.4.0
    profiles: ["aws"]
    environment:
      SERVICES: s3,sqs,secretsmanager
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./infra/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    networks:
      - eyk-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": \"running\"\\|\"s3\": \"available\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:

networks:
  eyk-net:
